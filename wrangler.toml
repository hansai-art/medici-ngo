# Cloudflare Pages 設定。
#
# 部署方式 = GitHub Actions 建置 + `wrangler pages deploy`（Pages direct upload），
# 不是 Pages 的 Git 整合。理由與取捨寫在 .github/workflows/ci.yml 的開頭。
# 一句話版本：direct upload 一樣有分支預覽網址，但不吃 Cloudflare 的建置額度，
# 而且預覽網址只有在我們自己的檢查全過之後才會出現。
#
# 這個檔同時給本機 `wrangler pages dev` 用，並且把 D1 綁定寫成程式碼：
# 綁定跟著 deploy 一起上去，不用在後台手動設 Production / Preview 兩份。
#
# 本機跑 Functions：
#   npm run build && npm run dev:api
# 它會用 .wrangler/state 底下的本機 D1，跟正式資料庫完全隔離。

name = "medici-ngo"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-01"

# D1 綁定。database_id 不是密鑰，可以進版控。
# 這一組是 2026-07-26 用 `wrangler d1 create medici-ngo` 建的（region APAC）。
[[d1_databases]]
binding = "DB"
database_name = "medici-ngo"
database_id = "94adc5e8-8be7-4cc5-9817-9c6c07e98caa"
