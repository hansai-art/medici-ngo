# PR 的機器守門。這裡紅燈就 merge 不進去。
#
# 為什麼每一關都要跑：這個 repo 收的是外部創作者的 markdown，
# 審稿的人用眼睛看一定會漏。所有規則都必須是機器擋的，靠自律的規則會在下一份稿子回歸。
#
# 這一份跟 Cloudflare Pages 的自動建置是兩回事：
# Pages 負責產出預覽網址給人看畫面，這裡負責擋不合格的內容。兩邊都要綠。

name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一個 PR 連續推的話，只跑最後一次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 內容與設計 token。最便宜也最常紅的兩關，先跑，錯了就不用等後面。
      - name: 內容規則
        run: npm run lint:content

      - name: 設計 token
        run: npm run lint:design

      - name: 單元測試
        run: npm run test

      - name: 型別（頁面）
        run: npm run check

      - name: 型別（Pages Functions）
        run: npm run check:functions

      # schema 驗證發生在 build：欄位缺漏、鏡號跳號、接點卡不對、60 秒鐵律都在這裡擋
      - name: 建置
        run: npm run build

      # 版面檢查要真的瀏覽器。版號跟 package.json 鎖死的一致，
      # 每個 playwright minor 版綁自己的瀏覽器建置編號，浮動會對不上。
      - name: 安裝 Chromium
        run: npx playwright install --with-deps chromium

      - name: 版面（手機寬度、貼邊、溢出）
        run: npm run check:layout

      - name: 字型子集缺字
        run: npm run check:font

      - name: SEO metadata 與 OG 圖
        run: npm run check:meta
